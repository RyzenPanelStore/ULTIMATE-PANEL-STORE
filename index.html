<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>PanelX • Professional Panel Hub</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background: #0b0d11;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 16px 12px 40px;
    }

    /* LOADING OVERLAY */
    #loading-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #0b0d11;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }
    #loading-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .loader-ring {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 6px solid rgba(0, 255, 200, 0.06);
      border-top: 6px solid #00f5d4;
      animation: spin 0.9s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      box-shadow: 0 0 40px rgba(0, 245, 212, 0.08);
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loader-text {
      margin-top: 30px;
      color: #b7c0d0;
      font-weight: 400;
      letter-spacing: 3px;
      font-size: 18px;
      text-transform: uppercase;
      background: rgba(255,255,255,0.02);
      padding: 10px 30px;
      border-radius: 60px;
      border: 1px solid rgba(255,255,255,0.03);
    }

    /* MAIN APP */
    #app {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      background: #12161c;
      border-radius: 40px;
      padding: 24px 20px 35px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.02);
    }

    /* HEADER */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 22px;
      border-bottom: 1px solid rgba(255,255,255,0.03);
      flex-wrap: wrap;
      gap: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand h1 {
      color: #f0f4ff;
      font-weight: 700;
      font-size: 38px;
      letter-spacing: -0.5px;
    }
    .brand span {
      color: #00f5d4;
      font-weight: 300;
    }
    .contact-btn {
      background: rgba(0, 245, 212, 0.04);
      border: 1px solid rgba(0, 245, 212, 0.12);
      padding: 16px 32px;
      border-radius: 60px;
      color: #cbd5e6;
      font-size: 22px;
      font-weight: 450;
      transition: all 0.2s;
      backdrop-filter: blur(4px);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .contact-btn:hover {
      background: rgba(0, 245, 212, 0.08);
      border-color: rgba(0, 245, 212, 0.25);
      color: #fff;
    }
    .contact-btn i {
      color: #00f5d4;
      font-style: normal;
      font-weight: 300;
      font-size: 26px;
    }

    /* TOS / INFO BANNER */
    .tos-banner {
      margin: 28px 0 30px;
      background: rgba(255, 255, 255, 0.01);
      border-radius: 32px;
      padding: 24px 30px;
      border: 1px solid rgba(255, 255, 255, 0.02);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }
    .tos-banner p {
      color: #98a9c7;
      font-size: 20px;
      line-height: 1.7;
      max-width: 75%;
    }
    .tos-banner strong {
      color: #dfe7f5;
      font-weight: 600;
    }
    .tos-banner .risk {
      color: #ffb37b;
      background: rgba(255, 180, 120, 0.05);
      padding: 8px 24px;
      border-radius: 60px;
      border: 1px solid rgba(255, 180, 120, 0.1);
      font-size: 18px;
      letter-spacing: 0.5px;
      font-weight: 500;
    }

    /* MAIN NAV - BIGGER & STACKED ON MOBILE */
    .panel-nav {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 30px;
      background: transparent;
      padding: 0;
      border: none;
    }
    .panel-nav button {
      background: rgba(255,255,255,0.01);
      border: 1px solid rgba(255,255,255,0.03);
      padding: 20px 28px;
      border-radius: 60px;
      color: #9aabca;
      font-weight: 500;
      font-size: 28px;
      transition: all 0.2s;
      cursor: pointer;
      backdrop-filter: blur(4px);
      letter-spacing: -0.2px;
      width: 100%;
      text-align: center;
    }
    .panel-nav button:hover {
      background: rgba(255,255,255,0.02);
      color: #dce5f5;
    }
    .panel-nav button.active {
      background: rgba(0, 245, 212, 0.06);
      color: #e0f5f0;
      box-shadow: 0 0 0 1px rgba(0, 245, 212, 0.1);
    }

    /* CARDS - VERTICAL SEQUENCE ONE UNDER ANOTHER */
    .panels-grid {
      display: flex;
      flex-direction: column;
      gap: 28px;
      margin-top: 8px;
      width: 100%;
    }

    .panel-card {
      background: rgba(255,255,255,0.01);
      border-radius: 36px;
      padding: 28px 26px 32px;
      border: 1px solid rgba(255,255,255,0.02);
      transition: all 0.25s;
      backdrop-filter: blur(2px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      width: 100%;
    }
    .panel-card:hover {
      background: rgba(255,255,255,0.02);
      border-color: rgba(255,255,255,0.04);
      transform: translateY(-3px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .panel-card .title {
      color: #f0f4ff;
      font-weight: 700;
      font-size: 38px;
      letter-spacing: -0.3px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .panel-card .badge {
      font-size: 20px;
      background: rgba(0,245,212,0.05);
      padding: 6px 18px;
      border-radius: 60px;
      color: #8acfc0;
      border: 1px solid rgba(0,245,212,0.06);
    }
    .panel-card .sub {
      color: #889bc0;
      font-size: 22px;
      margin-bottom: 22px;
      border-bottom: 1px solid rgba(255,255,255,0.02);
      padding-bottom: 18px;
    }
    .price-row {
      display: flex;
      flex-wrap: wrap;
      gap: 14px 20px;
      margin: 18px 0 8px;
    }
    .price-tag {
      background: rgba(255,255,255,0.02);
      padding: 12px 24px 12px 28px;
      border-radius: 60px;
      font-size: 22px;
      color: #bcc9e5;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      border: 1px solid rgba(255,255,255,0.02);
      cursor: pointer;
      transition: all 0.15s;
    }
    .price-tag:hover {
      background: rgba(0, 245, 212, 0.03);
      border-color: rgba(0, 245, 212, 0.08);
      color: #fff;
    }
    .price-tag .amount {
      color: #d4e0f5;
      font-weight: 600;
      font-size: 26px;
    }
    .price-tag .stock {
      font-size: 18px;
      color: #5d729c;
      margin-left: 6px;
    }
    .stock-fake {
      color: #5d729c;
      font-size: 18px;
      background: rgba(255,255,255,0.01);
      padding: 4px 16px;
      border-radius: 40px;
    }

    /* QR MODAL */
    .qr-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(2, 4, 8, 0.85);
      backdrop-filter: blur(16px);
      justify-content: center;
      align-items: center;
      z-index: 99999;
      padding: 20px;
    }
    .qr-modal.open {
      display: flex;
    }
    .qr-box {
      background: #181f28;
      border-radius: 56px;
      padding: 50px 40px;
      max-width: 500px;
      width: 100%;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.02);
      box-shadow: 0 40px 90px rgba(0,0,0,0.9);
    }
    .qr-box img {
      width: 100%;
      max-width: 280px;
      border-radius: 32px;
      background: white;
      padding: 12px;
      margin: 12px auto;
      display: block;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .qr-box .close-qr {
      margin-top: 36px;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.02);
      padding: 18px 40px;
      border-radius: 80px;
      color: #b7cbe5;
      font-size: 22px;
      cursor: pointer;
      transition: 0.15s;
      width: 100%;
    }
    .qr-box .close-qr:hover {
      background: rgba(255,255,255,0.04);
      color: #fff;
    }
    .qr-box .qr-label {
      color: #889fc9;
      font-size: 22px;
      margin-top: 14px;
    }

    /* MOBILE TWEAKS - BIGGER TEXT */
    @media (max-width: 600px) {
      body { padding: 10px 8px 30px; }
      #app { padding: 16px 14px 28px; border-radius: 32px; }
      .brand h1 { font-size: 34px; }
      .contact-btn { font-size: 20px; padding: 14px 22px; }
      .tos-banner p { font-size: 18px; max-width: 100%; }
      .tos-banner .risk { font-size: 16px; padding: 6px 18px; }
      .panel-nav button { font-size: 26px; padding: 18px 24px; }
      .panel-card .title { font-size: 34px; }
      .panel-card .sub { font-size: 20px; }
      .price-tag { font-size: 20px; padding: 10px 18px; flex-wrap: wrap; }
      .price-tag .amount { font-size: 24px; }
      .price-tag .stock { font-size: 16px; }
      .qr-box { padding: 30px 20px; }
      .qr-box img { max-width: 220px; }
      .qr-box .qr-label { font-size: 20px; }
      .qr-box .close-qr { font-size: 20px; padding: 14px 20px; }
    }

    @media (max-width: 400px) {
      .brand h1 { font-size: 28px; }
      .contact-btn { font-size: 17px; padding: 12px 16px; gap: 6px; }
      .panel-card .title { font-size: 28px; }
      .price-tag .amount { font-size: 22px; }
      .price-tag { font-size: 17px; padding: 8px 14px; }
    }
  </style>
</head>
<body>

<!-- LOADING -->
<div id="loading-overlay">
  <div class="loader-ring"></div>
  <div class="loader-text">loading panels</div>
</div>

<!-- QR MODAL -->
<div id="qrModal" class="qr-modal">
  <div class="qr-box">
    <div style="color:#d6e2f5; font-weight: 500; margin-bottom: 8px; font-size: 26px;">🔲 scan to pay</div>
    <img id="qrImage" src="qr-placeholder.png" alt="QR placeholder">
    <div class="qr-label" id="qrLabel">₹499 • Streamer Panel</div>
    <button class="close-qr" id="closeQrBtn">close</button>
  </div>
</div>

<!-- MAIN APP -->
<div id="app">

  <div class="top-bar">
    <div class="brand">
      <h1>⏣ <span>PANEL</span>X</h1>
      <span style="color:#475a7a; font-weight:300; font-size:20px; margin-left:8px;">v2</span>
    </div>
    <div class="contact-btn" id="contactBtn">
      <i>✆</i> +91 9366075423
    </div>
  </div>

  <!-- TOS / info -->
  <div class="tos-banner">
    <p>
      <strong>⏤ terms of service</strong> &nbsp; use at your own risk. 
      we do not guarantee uptime, compatibility, or refunds. 
      all panels are provided as-is.
    </p>
    <span class="risk">⚠️ self-responsibility</span>
  </div>

  <!-- navigation VERTICAL STACK -->
  <div class="panel-nav" id="panelNav">
    <button class="active" data-category="root">Root Panels</button>
    <button data-category="nonroot">Non Root</button>
    <button data-category="ios">iOS Panels</button>
  </div>

  <!-- cards container - vertical sequence -->
  <div id="panelsContainer" class="panels-grid"></div>

</div>

<script>
  // ----- DATA (all panels, sequence preserved) -----
  const panelData = {
    root: [
      { name: "Streamer Panel", badge: "Best Choice", plans: [
          { duration: "15 days", price: 499, stock: 12 },
          { duration: "30 days", price: 700, stock: 8 }
        ]
      },
      { name: "ANGRY MODS", badge: "", plans: [
          { duration: "15 days", price: 199, stock: 20 },
          { duration: "30 days", price: 350, stock: 15 }
        ]
      }
    ],
    nonroot: [
      { name: "Drip Client", badge: "", plans: [
          { duration: "15 days", price: 350, stock: 9 },
          { duration: "30 days", price: 650, stock: 5 }
        ]
      },
      { name: "Bala Mods", badge: "", plans: [
          { duration: "7 days", price: 250, stock: 14 },
          { duration: "15 days", price: 350, stock: 10 },
          { duration: "30 days", price: 600, stock: 7 }
        ]
      },
      { name: "XREG Panel", badge: "", plans: [
          { duration: "1 day", price: 99, stock: 30 },
          { duration: "7 days", price: 299, stock: 18 },
          { duration: "15 days", price: 399, stock: 11 },
          { duration: "30 days", price: 750, stock: 4 }
        ]
      }
    ],
    ios: [
      { name: "MIGUL Panel", badge: "stock 0 default", plans: [
          { duration: "1 day", price: 199, stock: 0 },
          { duration: "7 days", price: 450, stock: 0 },
          { duration: "15 days", price: 900, stock: 0 },
          { duration: "30 days", price: 1300, stock: 0 }
        ]
      },
      { name: "FLUORIDE Panel", badge: "", plans: [
          { duration: "7 days", price: 350, stock: 5 },
          { duration: "15 days", price: 600, stock: 3 },
          { duration: "30 days", price: 900, stock: 2 }
        ]
      }
    ]
  };

  // DOM refs
  const container = document.getElementById('panelsContainer');
  const navBtns = document.querySelectorAll('#panelNav button');
  const loadingOverlay = document.getElementById('loading-overlay');
  const qrModal = document.getElementById('qrModal');
  const qrImage = document.getElementById('qrImage');
  const qrLabel = document.getElementById('qrLabel');
  const closeQrBtn = document.getElementById('closeQrBtn');
  const contactBtn = document.getElementById('contactBtn');

  let currentCategory = 'root';

  // ----- RENDER CARDS (vertical sequence) -----
  function renderCategory(category) {
    const items = panelData[category] || [];
    let html = '';
    items.forEach(item => {
      const plansHtml = item.plans.map(p => {
        const stockDisplay = p.stock <= 0 ? '🟥 out' : `stock ${p.stock}`;
        return `<span class="price-tag" data-price="${p.price}" data-name="${item.name}" data-duration="${p.duration}" data-stock="${p.stock}">
          <span class="amount">₹${p.price}</span> 
          <span style="color:#6c84b0; font-weight:400;">${p.duration}</span>
          <span class="stock">${stockDisplay}</span>
        </span>`;
      }).join('');

      const badgeHtml = item.badge ? `<span class="badge">${item.badge}</span>` : '';
      html += `
        <div class="panel-card">
          <div class="title">
            ${item.name}
            ${badgeHtml}
          </div>
          <div class="sub">⚡ click amount to pay</div>
          <div class="price-row">${plansHtml}</div>
        </div>
      `;
    });
    container.innerHTML = html;
  }

  // ----- NAV SWITCH -----
  navBtns.forEach(btn => {
    btn.addEventListener('click', function() {
      navBtns.forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      const cat = this.getAttribute('data-category');
      currentCategory = cat;
      renderCategory(cat);
    });
  });

  // ----- QR CLICK (delegation) -----
  container.addEventListener('click', function(e) {
    const tag = e.target.closest('.price-tag');
    if (!tag) return;
    const price = tag.getAttribute('data-price');
    const name = tag.getAttribute('data-name') || 'Panel';
    const duration = tag.getAttribute('data-duration') || '';
    const stock = parseInt(tag.getAttribute('data-stock'), 10);
    if (stock <= 0) {
      alert('❌ Stock unavailable for this plan.');
      return;
    }
    qrLabel.innerText = `₹${price} • ${name} (${duration})`;
    qrImage.src = 'qr-placeholder.png?t=' + Date.now();
    qrModal.classList.add('open');
  });

  // close QR
  function closeQr() {
    qrModal.classList.remove('open');
  }
  closeQrBtn.addEventListener('click', closeQr);
  qrModal.addEventListener('click', function(e) {
    if (e.target === this) closeQr();
  });

  // contact button
  contactBtn.addEventListener('click', function() {
    alert('📞 Contact developer: +91 9366075423 (WhatsApp / Telegram)');
  });

  // ----- LOADING -----
  window.addEventListener('load', function() {
    setTimeout(() => {
      loadingOverlay.classList.add('hidden');
    }, 700);
  });

  // initial render
  renderCategory('root');
</script>

</body>
</html>
